server {
  listen 80;

  # Allow larger request bodies for file uploads (answer scans, notes PDFs/DOCX).
  # Must be >= the multer limits in the backend (notes 15MB, scans 8MB).
  client_max_body_size 20m;

  location /api {
    proxy_pass http://server:5000;
    # Don't buffer huge uploads to disk before forwarding; stream them.
    proxy_request_buffering off;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
